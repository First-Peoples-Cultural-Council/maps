proxy_cache_path /tmp/cache levels=1:2 keys_zone=nuxt-cache:25m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80 default_server;
    server_name locahost maps.fpcc.ca fplm.countable.ca;
    client_max_body_size 0;
    sendfile off;

    gzip on;
    gzip_disable "msie6";
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;

    gzip_min_length 1000;

    if ($http_x_forwarded_proto = 'http') {
        return 301 https://$host$request_uri;
    }

    # Keep health checks healthy during maintenance
    location = /elb-healthcheck {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Maintenance page
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Assets required by the maintenance page
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Everything else goes into maintenance mode
    location / {
        return 503;
    }
}