name: Maps Tests and Deployment

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: maps-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # Re-enable these when the reusable test workflows are ready.
  #
  # backend-tests:
  #   name: Backend Tests
  #   if: >-
  #     github.event_name == 'pull_request' ||
  #     (github.event_name == 'push' && github.ref == 'refs/heads/dev')
  #   uses: ./.github/workflows/test-backend.yml
  #
  # frontend-tests:
  #   name: Frontend Tests
  #   if: >-
  #     github.event_name == 'pull_request' ||
  #     (github.event_name == 'push' && github.ref == 'refs/heads/dev')
  #   uses: ./.github/workflows/test-frontend.yml

  set-context:
    name: Prepare Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    outputs:
      environment: ${{ steps.context.outputs.environment }}
      frontend_tag: ${{ steps.context.outputs.frontend_tag }}
      backend_tag: ${{ steps.context.outputs.backend_tag }}

    steps:
      - name: Prepare Build Context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          echo "environment=dev" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=fe-dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_tag=be-dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  pull-helm-chart:
    name: Prepare Helm Chart
    runs-on: ubuntu-latest
    environment: dev

    needs:
      - set-context

    steps:
      - name: Validate Infrastructure Configuration
        shell: bash
        env:
          INFRA_REPOSITORY: ${{ secrets.INFRA_REPOSITORY }}
          PULL_CONFIG_SECRET: ${{ secrets.PULL_CONFIG_SECRET }}
        run: |
          set -euo pipefail

          test -n "$INFRA_REPOSITORY"
          test -n "$PULL_CONFIG_SECRET"

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.INFRA_REPOSITORY }}
          ref: dev
          token: ${{ secrets.PULL_CONFIG_SECRET }}
          path: fv-infra
          sparse-checkout: |
            helm/maps
          sparse-checkout-cone-mode: false

      - name: Validate Helm Chart
        shell: bash
        run: |
          set -euo pipefail

          test -f fv-infra/helm/maps/Chart.yaml
          test -d fv-infra/helm/maps/templates

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: maps-helm-chart
          path: fv-infra/helm/maps
          if-no-files-found: error
          retention-days: 1

  build-frontend:
    name: Build and Publish Frontend
    runs-on: ubuntu-latest
    environment: dev

    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Build Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_INPUT: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          ECR_REPOSITORY_INPUT: ${{ secrets.ECR_REPOSITORY }}
          MAPBOX_ACCESS_TOKEN_INPUT: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_STYLE_URL_INPUT: ${{ secrets.MAPBOX_STYLE_URL }}
          COGNITO_URL_INPUT: ${{ secrets.COGNITO_URL }}
          COGNITO_APP_CLIENT_ID_INPUT: ${{ secrets.COGNITO_APP_CLIENT_ID }}
          COGNITO_HOST_INPUT: ${{ secrets.COGNITO_HOST }}
        run: |
          set -euo pipefail

          test -n "$AWS_ACCESS_KEY_ID_INPUT"
          test -n "$AWS_SECRET_ACCESS_KEY_INPUT"
          test -n "$AWS_REGION_INPUT"
          test -n "$ECR_REPOSITORY_INPUT"
          test -n "$MAPBOX_ACCESS_TOKEN_INPUT"
          test -n "$MAPBOX_STYLE_URL_INPUT"
          test -n "$COGNITO_URL_INPUT"
          test -n "$COGNITO_APP_CLIENT_ID_INPUT"
          test -n "$COGNITO_HOST_INPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Publish Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >-
            ${{ steps.login-ecr.outputs.registry }}/${{
            secrets.ECR_REPOSITORY }}:${{
            needs.set-context.outputs.frontend_tag }}
          build-args: |
            BACKEND_URL=http://maps-backend:8000
            MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
            MAPBOX_STYLE_URL=${{ secrets.MAPBOX_STYLE_URL }}
            COGNITO_URL=${{ secrets.COGNITO_URL }}
            COGNITO_APP_CLIENT_ID=${{ secrets.COGNITO_APP_CLIENT_ID }}
            COGNITO_HOST=${{ secrets.COGNITO_HOST }}
          cache-from: type=gha,scope=maps-frontend
          cache-to: type=gha,mode=max,scope=maps-frontend
          provenance: false

  build-backend:
    name: Build and Publish Backend
    runs-on: ubuntu-latest
    environment: dev

    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Build Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_INPUT: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          ECR_REPOSITORY_INPUT: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          test -n "$AWS_ACCESS_KEY_ID_INPUT"
          test -n "$AWS_SECRET_ACCESS_KEY_INPUT"
          test -n "$AWS_REGION_INPUT"
          test -n "$ECR_REPOSITORY_INPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Publish Backend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >-
            ${{ steps.login-ecr.outputs.registry }}/${{
            secrets.ECR_REPOSITORY }}:${{
            needs.set-context.outputs.backend_tag }}
          cache-from: type=gha,scope=maps-backend
          cache-to: type=gha,mode=max,scope=maps-backend
          provenance: false

  update-values:
    name: Update Deployment Configuration
    runs-on: ubuntu-latest
    environment: dev

    needs:
      - set-context
      - build-frontend
      - build-backend

    env:
      CODE_COMMIT_REPOSITORY: ${{ secrets.CODE_COMMIT }}
      FRONTEND_TAG: ${{ needs.set-context.outputs.frontend_tag }}
      BACKEND_TAG: ${{ needs.set-context.outputs.backend_tag }}

    steps:
      - name: Validate Deployment Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_INPUT: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
        run: |
          set -euo pipefail

          test -n "$AWS_ACCESS_KEY_ID_INPUT"
          test -n "$AWS_SECRET_ACCESS_KEY_INPUT"
          test -n "$AWS_REGION_INPUT"
          test -n "$CODE_COMMIT_REPOSITORY"
          test -n "$FRONTEND_TAG"
          test -n "$BACKEND_TAG"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          mask-aws-account-id: true

      - name: Download Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! aws codecommit get-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --commit-specifier main \
            --file-path "Values.dev_maps.yaml" \
            --query fileContent \
            --output text \
            2> codecommit-download-error.log |
            base64 -d > values.yaml; then

            echo "Unable to download deployment configuration"
            cat codecommit-download-error.log
            exit 1
          fi

          if [[ ! -s values.yaml ]]; then
            echo "Downloaded deployment configuration is empty"
            cat codecommit-download-error.log
            exit 1
          fi

          rm -f codecommit-download-error.log

      - name: Update Image References
        uses: mikefarah/yq@v4.45.4
        env:
          FRONTEND_TAG: ${{ env.FRONTEND_TAG }}
          BACKEND_TAG: ${{ env.BACKEND_TAG }}
        with:
          cmd: >-
            yq -i
            '.frontend.image.tag = strenv(FRONTEND_TAG) |
            .backend.image.tag = strenv(BACKEND_TAG)'
            values.yaml

      - name: Validate Image References
        uses: mikefarah/yq@v4.45.4
        env:
          FRONTEND_TAG: ${{ env.FRONTEND_TAG }}
          BACKEND_TAG: ${{ env.BACKEND_TAG }}
        with:
          cmd: >-
            yq -e
            '.frontend.image.tag == strenv(FRONTEND_TAG) and
            .backend.image.tag == strenv(BACKEND_TAG)'
            values.yaml

      - name: Get Current Configuration Revision
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_ID=$(
            aws codecommit get-branch \
              --repository-name "$CODE_COMMIT_REPOSITORY" \
              --branch-name main \
              --query branch.commitId \
              --output text \
              2> codecommit-revision-error.log
          )

          if [[ -z "$COMMIT_ID" || "$COMMIT_ID" == "None" ]]; then
            echo "Unable to find the current deployment configuration revision"
            cat codecommit-revision-error.log
            exit 1
          fi

          rm -f codecommit-revision-error.log
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Publish Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! aws codecommit put-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --branch-name main \
            --file-path "Values.dev_maps.yaml" \
            --file-content fileb://values.yaml \
            --parent-commit-id "${{ steps.commit.outputs.commit_id }}" \
            --commit-message "Update Maps dev image references" \
            --no-cli-pager \
            > /dev/null \
            2> codecommit-upload-error.log; then

            echo "Unable to publish the deployment configuration"
            cat codecommit-upload-error.log
            exit 1
          fi

          rm -f codecommit-upload-error.log

      - name: Upload Helm Values
        uses: actions/upload-artifact@v4
        with:
          name: maps-helm-values
          path: values.yaml
          if-no-files-found: error
          retention-days: 1

  helm-upgrade-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev

    needs:
      - set-context
      - update-values
      - pull-helm-chart

    steps:
      - name: Download Helm Chart
        uses: actions/download-artifact@v4
        with:
          name: maps-helm-chart
          path: ./chart

      - name: Download Helm Values
        uses: actions/download-artifact@v4
        with:
          name: maps-helm-values
          path: .

      - name: Validate Deployment Inputs
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_INPUT: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          EKS_CLUSTER_NAME_INPUT: ${{ secrets.EKS_CLUSTER_NAME }}
          K8S_NAMESPACE_INPUT: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME_INPUT: ${{ vars.HELM_RELEASE_NAME }}
        run: |
          set -euo pipefail

          test -n "$AWS_ACCESS_KEY_ID_INPUT"
          test -n "$AWS_SECRET_ACCESS_KEY_INPUT"
          test -n "$AWS_REGION_INPUT"
          test -n "$EKS_CLUSTER_NAME_INPUT"
          test -n "$K8S_NAMESPACE_INPUT"
          test -n "$HELM_RELEASE_NAME_INPUT"

          test -f ./chart/Chart.yaml
          test -d ./chart/templates
          test -f ./values.yaml

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          mask-aws-account-id: true

      - name: Set Up Helm
        uses: azure/setup-helm@v4

      - name: Configure Kubernetes
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${{ secrets.FPCC_DEFAULT_AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Verify Cluster Access
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get namespace "${{ vars.K8S_NAMESPACE }}"
          helm list --namespace "${{ vars.K8S_NAMESPACE }}"

      - name: Lint Helm Chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint ./chart \
            --values ./values.yaml

      - name: Render Helm Manifests
        shell: bash
        run: |
          set -euo pipefail

          helm template \
            "${{ vars.HELM_RELEASE_NAME }}" \
            ./chart \
            --namespace "${{ vars.K8S_NAMESPACE }}" \
            --values ./values.yaml \
            > /dev/null

      - name: Deploy Maps
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade \
            --install \
            "${{ vars.HELM_RELEASE_NAME }}" \
            ./chart \
            --namespace "${{ vars.K8S_NAMESPACE }}" \
            --create-namespace \
            --values ./values.yaml \
            --atomic \
            --wait \
            --timeout 15m

      - name: Verify Rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/maps-frontend \
            --namespace "${{ vars.K8S_NAMESPACE }}" \
            --timeout=10m

          kubectl rollout status deployment/maps-backend \
            --namespace "${{ vars.K8S_NAMESPACE }}" \
            --timeout=10m

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Maps Dev Deployment"
            echo
            echo "**Release:** \`${{ vars.HELM_RELEASE_NAME }}\`"
            echo
            echo "**Namespace:** \`${{ vars.K8S_NAMESPACE }}\`"
            echo
            echo "**Frontend image tag:** \`${{ needs.set-context.outputs.frontend_tag }}\`"
            echo "**Backend image tag:** \`${{ needs.set-context.outputs.backend_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  image-scan:
    name: Image Scan (${{ matrix.image }})
    runs-on: ubuntu-22.04
    environment: dev
    continue-on-error: true

    needs:
      - set-context
      - helm-upgrade-dev

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            tag: ${{ needs.set-context.outputs.frontend_tag }}

          - image: backend
            tag: ${{ needs.set-context.outputs.backend_tag }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Validate Image Reference
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_INPUT: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail

          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY_INPUT"
          test -n "$IMAGE_TAG"

          echo "Scanning $ECR_REGISTRY/$ECR_REPOSITORY_INPUT:$IMAGE_TAG"

      - name: Run Trivy Scan
        id: trivy
        continue-on-error: true
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.tag }}
        run: |
          set -euo pipefail

          trivy image \
            --platform linux/amd64 \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-findings.json \
            --exit-code 1 \
            "$IMAGE_REFERENCE"

      - name: Run ECR Scan
        id: ecr
        continue-on-error: true
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.tag }}
          ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          IMAGE_DIGEST=$(
            docker buildx imagetools inspect \
              "$IMAGE_REFERENCE" \
              --raw |
            jq -r '
              .manifests[]? |
              select(
                .platform.os == "linux" and
                .platform.architecture == "amd64"
              ) |
              .digest
            ' |
            head -n 1
          )

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "null" ]]; then
            echo "Unable to determine the linux/amd64 image digest"
            exit 1
          fi

          echo "Scanning image digest: $IMAGE_DIGEST"

          SCAN_STATUS=$(
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY_NAME" \
              --image-id "imageDigest=$IMAGE_DIGEST" \
              --query 'imageScanStatus.status' \
              --output text \
              2>/dev/null ||
            true
          )

          echo "Current ECR scan status: $SCAN_STATUS"

          if [[ "$SCAN_STATUS" != "IN_PROGRESS" &&
                "$SCAN_STATUS" != "COMPLETE" ]]; then

            if ! SCAN_OUTPUT=$(
              aws ecr start-image-scan \
                --repository-name "$ECR_REPOSITORY_NAME" \
                --image-id "imageDigest=$IMAGE_DIGEST" \
                2>&1
            ); then
              if [[ "$SCAN_OUTPUT" == *"LimitExceededException"* ]]; then
                echo "ECR scan quota reached; attempting to use an existing scan"
              else
                echo "$SCAN_OUTPUT"
                exit 1
              fi
            fi
          fi

          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-id "imageDigest=$IMAGE_DIGEST"

          aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-id "imageDigest=$IMAGE_DIGEST" \
            --query 'imageScanFindings.findings' \
            --output json \
            > ecr-findings.json

          jq '
            [
              .[]? |
              select(
                .severity == "HIGH" or
                .severity == "CRITICAL"
              )
            ]
          ' ecr-findings.json > ecr-high-critical.json

          echo "HIGH and CRITICAL ECR findings:"
          jq . ecr-high-critical.json

          test "$(jq length ecr-high-critical.json)" -eq 0

      - name: Evaluate Scan Results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_HIGH="N/A"
          TRIVY_CRITICAL="N/A"
          ECR_HIGH="N/A"
          ECR_CRITICAL="N/A"

          if [[ -f trivy-findings.json ]]; then
            TRIVY_HIGH=$(
              jq '
                [
                  .Results[]?.Vulnerabilities[]? |
                  select(.Severity == "HIGH")
                ] |
                length
              ' trivy-findings.json
            )

            TRIVY_CRITICAL=$(
              jq '
                [
                  .Results[]?.Vulnerabilities[]? |
                  select(.Severity == "CRITICAL")
                ] |
                length
              ' trivy-findings.json
            )
          fi

          if [[ -f ecr-high-critical.json ]]; then
            ECR_HIGH=$(
              jq '
                [
                  .[]? |
                  select(.severity == "HIGH")
                ] |
                length
              ' ecr-high-critical.json
            )

            ECR_CRITICAL=$(
              jq '
                [
                  .[]? |
                  select(.severity == "CRITICAL")
                ] |
                length
              ' ecr-high-critical.json
            )
          fi

          TRIVY_RESULT="Passed"
          ECR_RESULT="Passed"
          OVERALL_RESULT="Passed"

          if [[ "${{ steps.trivy.outcome }}" != "success" ]]; then
            TRIVY_RESULT="Failed"
          fi

          if [[ "${{ steps.ecr.outcome }}" != "success" ]]; then
            ECR_RESULT="Failed"
          fi

          if [[ "$TRIVY_RESULT" == "Failed" ||
                "$ECR_RESULT" == "Failed" ]]; then
            OVERALL_RESULT="Failed"
          fi

          {
            echo "## Image Security Scan: ${{ matrix.image }}"
            echo
            echo "**Tag:** \`${{ matrix.tag }}\`  "
            echo "**Platform:** \`linux/amd64\`  "
            echo "**Overall result:** **$OVERALL_RESULT**"
            echo
            echo "| Scanner | High | Critical | Result |"
            echo "| --- | ---: | ---: | --- |"
            echo "| Trivy | $TRIVY_HIGH | $TRIVY_CRITICAL | $TRIVY_RESULT |"
            echo "| ECR | $ECR_HIGH | $ECR_CRITICAL | $ECR_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$OVERALL_RESULT" == "Failed" ]]; then
            echo "HIGH or CRITICAL vulnerabilities found for ${{ matrix.image }}"
            exit 1
          fi

          echo "No HIGH or CRITICAL vulnerabilities found for ${{ matrix.image }}"

      - name: Upload Security Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ matrix.image }}-${{ matrix.tag }}
          path: |
            trivy-findings.json
            ecr-findings.json
            ecr-high-critical.json
          if-no-files-found: warn
          retention-days: 7
