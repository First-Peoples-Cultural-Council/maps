name: Maps Deployment

on:
  push:
    branches:
      - dev

  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: maps-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  set-context:
    name: Prepare Build
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.context.outputs.environment }}
      fe_tag: ${{ steps.context.outputs.fe_tag }}
      be_tag: ${{ steps.context.outputs.be_tag }}

    steps:
      - name: Prepare Build Context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" &&
                "${GITHUB_REF}" == "refs/heads/dev" ]]; then

            ENVIRONMENT="dev"
            SHORT_SHA="${GITHUB_SHA::7}"

            FE_TAG="fe-dev-${SHORT_SHA}"
            BE_TAG="be-dev-${SHORT_SHA}"

          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then

            ENVIRONMENT="prod"
            RELEASE_TAG="${{ github.event.release.tag_name }}"

            if [[ -z "$RELEASE_TAG" ]]; then
              echo "Required release information is unavailable"
              exit 1
            fi

            FE_TAG="fe-${RELEASE_TAG}"
            BE_TAG="be-${RELEASE_TAG}"

          else
            echo "Unsupported workflow trigger"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "fe_tag=$FE_TAG" >> "$GITHUB_OUTPUT"
          echo "be_tag=$BE_TAG" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Build Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ||
                -z "$AWS_SECRET_ACCESS_KEY_INPUT" ||
                -z "$AWS_REGION" ||
                -z "$ECR_REPOSITORY" ]]; then
            echo "Required build configuration is unavailable"
            exit 1
          fi

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build Application
        working-directory: frontend
        run: yarn run build

      - name: Configure Build Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up Cross-Platform Support
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Validate Frontend Image Reference
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.set-context.outputs.fe_tag }}
        run: |
          set -euo pipefail

          [[ -n "$REGISTRY" ]]
          [[ -n "$REPOSITORY" ]]
          [[ -n "$IMAGE_TAG" ]]

          IMAGE_REF="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          docker pull alpine:latest > /dev/null
          docker tag alpine:latest "$IMAGE_REF"

      - name: Set Up Container Builder
        uses: docker/setup-buildx-action@v4

      - name: Build and Publish Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.set-context.outputs.fe_tag }}
          cache-from: type=gha,scope=maps-frontend
          cache-to: type=gha,mode=max,scope=maps-frontend
          provenance: false

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Build Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ||
                -z "$AWS_SECRET_ACCESS_KEY_INPUT" ||
                -z "$AWS_REGION" ||
                -z "$ECR_REPOSITORY" ]]; then
            echo "Required build configuration is unavailable"
            exit 1
          fi

      - name: Configure Build Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up Cross-Platform Support
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Validate Backend Image Reference
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.set-context.outputs.be_tag }}
        run: |
          set -euo pipefail

          [[ -n "$REGISTRY" ]]
          [[ -n "$REPOSITORY" ]]
          [[ -n "$IMAGE_TAG" ]]

          IMAGE_REF="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          docker pull alpine:latest > /dev/null
          docker tag alpine:latest "$IMAGE_REF"

      - name: Set Up Container Builder
        uses: docker/setup-buildx-action@v4

      - name: Build and Publish Backend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.set-context.outputs.be_tag }}
          cache-from: type=gha,scope=maps-backend
          cache-to: type=gha,mode=max,scope=maps-backend
          provenance: false

  update-values:
    name: Update Deployment Configuration
    runs-on: ubuntu-latest

    needs:
      - set-context
      - build-frontend
      - build-backend

    env:
      CODE_COMMIT_REPOSITORY: ${{ secrets.CODE_COMMIT }}
      FE_TAG: ${{ needs.set-context.outputs.fe_tag }}
      BE_TAG: ${{ needs.set-context.outputs.be_tag }}

    steps:
      - name: Validate Deployment Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ||
                -z "$AWS_SECRET_ACCESS_KEY_INPUT" ||
                -z "$AWS_REGION" ||
                -z "$CODE_COMMIT_REPOSITORY" ]]; then
            echo "Required deployment configuration is unavailable"
            exit 1
          fi

      - name: Configure Deployment Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Select Deployment Configuration
        id: values
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ needs.set-context.outputs.environment }}"

          case "$ENVIRONMENT" in
            dev)
              VALUES_FILE="Values.dev_maps.yaml"
              ;;
            prod)
              VALUES_FILE="Values.prod_maps.yaml"
              ;;
            *)
              echo "Unsupported deployment environment"
              exit 1
              ;;
          esac

          echo "values_file=$VALUES_FILE" >> "$GITHUB_OUTPUT"

      - name: Download Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          aws codecommit get-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --commit-specifier main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --query fileContent \
            --output text \
            2> codecommit-download-error.log |
          base64 -d > values.yaml

          if [[ ! -s values.yaml ]]; then
            echo "Unable to download deployment configuration"
            cat codecommit-download-error.log
            exit 1
          fi

          rm -f codecommit-download-error.log

      - name: Update Image References
        uses: mikefarah/yq@v4.45.4
        env:
          FE_TAG: ${{ env.FE_TAG }}
          BE_TAG: ${{ env.BE_TAG }}
        with:
          cmd: >-
            yq -i
            '.frontend.image.tag = strenv(FE_TAG) |
            .backend.image.tag = strenv(BE_TAG)'
            values.yaml

      - name: Validate Deployment Configuration
        uses: mikefarah/yq@v4.45.4
        env:
          FE_TAG: ${{ env.FE_TAG }}
          BE_TAG: ${{ env.BE_TAG }}
        with:
          cmd: >-
            yq -e
            '.frontend.image.tag == strenv(FE_TAG) and
            .backend.image.tag == strenv(BE_TAG)'
            values.yaml

      - name: Get Current Configuration Revision
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_ID=$(
            aws codecommit get-branch \
              --repository-name "$CODE_COMMIT_REPOSITORY" \
              --branch-name main \
              --query branch.commitId \
              --output text \
              2> codecommit-revision-error.log
          )

          if [[ -z "$COMMIT_ID" || "$COMMIT_ID" == "None" ]]; then
            echo "Unable to find the current deployment configuration revision"
            cat codecommit-revision-error.log
            exit 1
          fi

          rm -f codecommit-revision-error.log

          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Publish Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! aws codecommit put-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --branch-name main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --file-content fileb://values.yaml \
            --parent-commit-id "${{ steps.commit.outputs.commit_id }}" \
            --commit-message "Update Maps deployment image references" \
            --no-cli-pager \
            > /dev/null 2> codecommit-upload-error.log; then

            echo "Unable to publish the deployment configuration"
            cat codecommit-upload-error.log
            exit 1
          fi

          rm -f codecommit-upload-error.log
          echo "Deployment configuration updated successfully"