name: Build Images

on:
  push:
    branches:
      - dev

jobs:
  set-context:
    name: Set Context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      fe_tag: ${{ steps.context.outputs.fe_tag }}
      be_tag: ${{ steps.context.outputs.be_tag }}

    steps:
      - name: Compute Env
        id: context
        shell: bash
        run: |
      
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
      
            ENVIRONMENT="dev"
            SHORT_SHA="${GITHUB_SHA::7}"
            IMAGE_SHA_TAG="dev-${SHORT_SHA}"
      
            FE_TAG="fe-${IMAGE_SHA_TAG}"
            BE_TAG="be-${IMAGE_SHA_TAG}"
      
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
      
            ENVIRONMENT="prod"
      
            FE_TAG="fe-${GITHUB_REF_NAME}"
            BE_TAG="be-${GITHUB_REF_NAME}"
      
          else
            echo "Unsupported deployment source"
            exit 1
          fi
      
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "fe_tag=$FE_TAG" >> "$GITHUB_OUTPUT"
          echo "be_tag=$BE_TAG" >> "$GITHUB_OUTPUT"

  build-and-push-images:
    name: Build and Push Images (Dev)
    runs-on: ubuntu-latest
    needs: [set-context]
    env:
      AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn run build

      - name: Build frontend Docker image (no push)
        run: |
          docker build \
            -f Dockerfile \
            -t frontend-dev:${{ github.sha }} \
            .

      - name: Build backend Docker image (no push)
        run: |
          docker build \
            -f ../web/Dockerfile \
            -t backend-dev:${{ github.sha }} \
            ../web

      - name: Validate AWS/ECR inputs
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_ACCESS_KEY_ID"
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "Missing secret: FPCC_DEFAULT_AWS_REGION"
            exit 1
          fi

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "Missing secret: ECR_REPOSITORY"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_INPUT }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_INPUT }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push frontend and backend images to ECR
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          FE_TAG="${{ needs.set-context.outputs.fe_tag }}"
          BE_TAG="${{ needs.set-context.outputs.be_tag }}"

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "ECR_REPOSITORY variable is required"
            exit 1
          fi

          docker tag "frontend-dev:${GITHUB_SHA}" "$ECR_REGISTRY/$ECR_REPOSITORY:$FE_TAG"
          docker tag "backend-dev:${GITHUB_SHA}" "$ECR_REGISTRY/$ECR_REPOSITORY:$BE_TAG"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$FE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$BE_TAG"
  update-values:
    name: Update Helm Values
    runs-on: ubuntu-latest

    needs:
      - set-context
      - build-and-push-images

    env:
      AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Select Values File
        id: values
        shell: bash
        run: |
          ENVIRONMENT="${{ needs.set-context.outputs.environment }}"

          if [[ "$ENVIRONMENT" == "prod" ]]; then
            VALUES_FILE="Values.prod_maps.yaml"
          else
            VALUES_FILE="Values.dev_maps.yaml"
          fi

          echo "values_file=$VALUES_FILE" >> "$GITHUB_OUTPUT"

      - name: Download Values File
        run: |
          aws codecommit get-file \
            --repository-name "${{ secrets.CODE_COMMIT }}" \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --query fileContent \
            --output text | base64 -d > values.yaml

      - name: Update Image Tags
        run: |
          yq -i '
            .frontend.image.tag = "${{ needs.set-context.outputs.fe_tag }}"
          ' values.yaml

          yq -i '
            .backend.image.tag = "${{ needs.set-context.outputs.be_tag }}"
          ' values.yaml

      - name: Get Current Commit
        id: commit
        run: |
          COMMIT_ID=$(aws codecommit get-branch \
            --repository-name "${{ secrets.CODE_COMMIT }}" \
            --branch-name main \
            --query branch.commitId \
            --output text)

          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload Updated Values File
        run: |
          FILE_CONTENT=$(base64 -w 0 values.yaml)

          aws codecommit put-file \
            --repository-name "${{ secrets.CODE_COMMIT }}" \
            --branch-name main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --file-content "$FILE_CONTENT" \
            --parent-commit-id "${{ steps.commit.outputs.commit_id }}" \
            --commit-message "Update Maps image tags (${{
              needs.set-context.outputs.fe_tag
            }} / ${{
              needs.set-context.outputs.be_tag
            }})"
          echo "Latest image tag is updated for this environment"