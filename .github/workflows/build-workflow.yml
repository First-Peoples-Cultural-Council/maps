name: Maps Tests and Deployment

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: maps-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
#  backend-tests:
#    name: Backend Tests
#    if: >-
#      github.event_name == 'pull_request' ||
#      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
#    uses: ./.github/workflows/test-backend.yml
#
#  frontend-tests:
#    name: Frontend Tests
#    if: >-
#      github.event_name == 'pull_request' ||
#      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
#    uses: ./.github/workflows/test-frontend.yml

  set-context:
    name: Prepare Build
    runs-on: ubuntu-latest

#    needs:
#      - backend-tests
#      - frontend-tests

#    if: >-
#      always() &&
#      (
#        github.event_name == 'release' ||
#        (
#          github.event_name == 'push' &&
#          needs.backend-tests.result == 'success' &&
#          needs.frontend-tests.result == 'success'
#        )
#      )

    outputs:
      environment: ${{ steps.context.outputs.environment }}
      fe_tag: ${{ steps.context.outputs.fe_tag }}
      be_tag: ${{ steps.context.outputs.be_tag }}

    steps:
      - name: Prepare Build Context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" &&
                "${GITHUB_REF}" == "refs/heads/dev" ]]; then

            ENVIRONMENT="dev"
            SHORT_SHA="${GITHUB_SHA::7}"

            FE_TAG="fe-dev-${SHORT_SHA}"
            BE_TAG="be-dev-${SHORT_SHA}"

          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then

            ENVIRONMENT="prod"
            RELEASE_TAG="${{ github.event.release.tag_name }}"

            if [[ -z "$RELEASE_TAG" ]]; then
              echo "Required release information is unavailable"
              exit 1
            fi

            FE_TAG="fe-${RELEASE_TAG}"
            BE_TAG="be-${RELEASE_TAG}"

          else
            echo "Unsupported workflow trigger"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "fe_tag=$FE_TAG" >> "$GITHUB_OUTPUT"
          echo "be_tag=$BE_TAG" >> "$GITHUB_OUTPUT"

  pull-helm-chart:
    name: Download Helm Charts
    runs-on: ubuntu-latest

    needs:
      - set-context

    steps:
      - name: Checkout fv-infra
        uses: actions/checkout@v5
        with:
          repository: First-Peoples-Cultural-Council/fv-infra
          ref: dev
          token: ${{ secrets.PULL_CONFIG_SECRET }}
          path: helm

      - name: Upload Helm Charts
        uses: actions/upload-artifact@v4
        with:
          name: helm
          path: helm


  build-frontend:
    name: Build and Upload Frontend Image
    runs-on: ubuntu-latest

    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Build Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ||
                -z "$AWS_SECRET_ACCESS_KEY_INPUT" ||
                -z "$AWS_REGION" ||
                -z "$ECR_REPOSITORY" ]]; then
            echo "Required build configuration is unavailable"
            exit 1
          fi

      - name: Configure Build Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up Cross-Platform Support
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64


      - name: Set Up Container Builder
        uses: docker/setup-buildx-action@v4

      - name: Build and Publish Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.set-context.outputs.fe_tag }}
          build-args: |
            BACKEND_URL=http://maps-backend:8000
            MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
            MAPBOX_STYLE_URL=${{ secrets.MAPBOX_STYLE_URL }}
            COGNITO_URL=${{ secrets.COGNITO_URL }}
            COGNITO_APP_CLIENT_ID=${{ secrets.COGNITO_APP_CLIENT_ID }}
            COGNITO_HOST=${{ secrets.COGNITO_HOST }}
          cache-from: type=gha,scope=maps-frontend
          cache-to: type=gha,mode=max,scope=maps-frontend
          provenance: false

  build-backend:
    name: Build and Upload Backend Image
    runs-on: ubuntu-latest

    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Build Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ||
                -z "$AWS_SECRET_ACCESS_KEY_INPUT" ||
                -z "$AWS_REGION" ||
                -z "$ECR_REPOSITORY" ]]; then
            echo "Required build configuration is unavailable"
            exit 1
          fi

      - name: Configure Build Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up Cross-Platform Support
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set Up Container Builder
        uses: docker/setup-buildx-action@v4

      - name: Build and Publish Backend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.set-context.outputs.be_tag }}
          cache-from: type=gha,scope=maps-backend
          cache-to: type=gha,mode=max,scope=maps-backend
          provenance: false

  update-values:
    name: Update Deployment Configuration
    runs-on: ubuntu-latest

    needs:
      - set-context
      - build-frontend
      - build-backend

    env:
      CODE_COMMIT_REPOSITORY: ${{ secrets.CODE_COMMIT }}
      FE_TAG: ${{ needs.set-context.outputs.fe_tag }}
      BE_TAG: ${{ needs.set-context.outputs.be_tag }}

    steps:
      - name: Validate Deployment Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ||
                -z "$AWS_SECRET_ACCESS_KEY_INPUT" ||
                -z "$AWS_REGION" ||
                -z "$CODE_COMMIT_REPOSITORY" ]]; then
            echo "Required deployment configuration is unavailable"
            exit 1
          fi

      - name: Configure Deployment Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Select Deployment Configuration
        id: values
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ needs.set-context.outputs.environment }}"

          case "$ENVIRONMENT" in
            dev)
              VALUES_FILE="Values.dev_maps.yaml"
              ;;
            prod)
              VALUES_FILE="Values.prod_maps.yaml"
              ;;
            *)
              echo "Unsupported deployment environment"
              exit 1
              ;;
          esac

          echo "values_file=$VALUES_FILE" >> "$GITHUB_OUTPUT"

      - name: Download Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          aws codecommit get-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --commit-specifier main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --query fileContent \
            --output text \
            2> codecommit-download-error.log |
          base64 -d > values.yaml

          if [[ ! -s values.yaml ]]; then
            echo "Unable to download deployment configuration"
            cat codecommit-download-error.log
            exit 1
          fi

          rm -f codecommit-download-error.log

      - name: Update Image References
        uses: mikefarah/yq@v4.45.4
        env:
          FE_TAG: ${{ env.FE_TAG }}
          BE_TAG: ${{ env.BE_TAG }}
        with:
          cmd: >-
            yq -i
            '.frontend.image.tag = strenv(FE_TAG) |
            .backend.image.tag = strenv(BE_TAG)'
            values.yaml

      - name: Validate Deployment Configuration
        uses: mikefarah/yq@v4.45.4
        env:
          FE_TAG: ${{ env.FE_TAG }}
          BE_TAG: ${{ env.BE_TAG }}
        with:
          cmd: >-
            yq -e
            '.frontend.image.tag == strenv(FE_TAG) and
            .backend.image.tag == strenv(BE_TAG)'
            values.yaml

      - name: Get Current Configuration Revision
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_ID=$(
            aws codecommit get-branch \
              --repository-name "$CODE_COMMIT_REPOSITORY" \
              --branch-name main \
              --query branch.commitId \
              --output text \
              2> codecommit-revision-error.log
          )

          if [[ -z "$COMMIT_ID" || "$COMMIT_ID" == "None" ]]; then
            echo "Unable to find the current deployment configuration revision"
            cat codecommit-revision-error.log
            exit 1
          fi

          rm -f codecommit-revision-error.log

          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Publish Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! aws codecommit put-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --branch-name main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --file-content fileb://values.yaml \
            --parent-commit-id "${{ steps.commit.outputs.commit_id }}" \
            --commit-message "Update Maps deployment image references" \
            --no-cli-pager \
            > /dev/null 2> codecommit-upload-error.log; then

            echo "Unable to publish the deployment configuration"
            cat codecommit-upload-error.log
            exit 1
          fi

          rm -f codecommit-upload-error.log
          echo "Deployment configuration updated successfully"
      - name: Upload Helm Values
        uses: actions/upload-artifact@v4
        with:
          name: helm-values
          path: values.yaml

  helm-upgrade-dev:
    name: Deploy - Dev
    runs-on: ubuntu-latest

    needs:
      - update-values
      - pull-helm-chart

    if: github.ref == 'refs/heads/dev'

    environment: dev

    steps:
      - uses: actions/checkout@v5

      - name: Download Helm Charts
        uses: actions/download-artifact@v4
        with:
          name: helm
          path: ./

      - name: Download Helm Values
        uses: actions/download-artifact@v4
        with:
          name: helm-values
          path: .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.FPCC_DEFAULT_AWS_REGION }} \
            --name firstvoices-eks

      - name: Verify Cluster Access
        run: |
          kubectl get ns 2026-08-maps-dev
          helm list -n 2026-08-maps-dev

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint ./helm/maps \
            -f values.yaml

      - name: Deploy Maps
        run: |
          helm upgrade \
            --install \
            maps-dev \
            ./helm/maps \
            -n 2026-08-maps-dev \
            --create-namespace \
            -f values.yaml \
            --atomic \
            --wait \
            --timeout 15m

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/maps-frontend \
            -n 2026-08-maps-dev \
            --timeout=10m

          kubectl rollout status deployment/maps-backend \
            -n 2026-08-maps-dev \
            --timeout=10m

  image-scan:
    name: Image Scans (${{ matrix.image }})
    runs-on: ubuntu-22.04
    continue-on-error: true
    needs:
      - set-context
      - helm-upgrade-dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            tag: ${{ needs.set-context.outputs.fe_tag }}
          - image: backend
            tag: ${{ needs.set-context.outputs.be_tag }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Authenticate Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set Up Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Run Trivy Scan
        id: trivy
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.tag }}
        run: |
          if trivy image --platform linux/amd64 --scanners vuln --severity HIGH,CRITICAL --format json --output trivy-findings.json --exit-code 1 "$IMAGE_REF"; then
            SCAN_EXIT=0
          else
            SCAN_EXIT=$?
          fi

          jq '[.Results[]?.Vulnerabilities[]? | {VulnerabilityID, PkgName, InstalledVersion, FixedVersion, Severity, Title}]' trivy-findings.json
          exit "$SCAN_EXIT"

      - name: Run ECR Scan
        id: ecr
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.tag }}
        run: |
          IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE_REF" --raw | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          SCAN_STATUS=$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$IMAGE_DIGEST" --query 'imageScanStatus.status' --output text 2>/dev/null || true)

          if [[ "$SCAN_STATUS" != "IN_PROGRESS" && "$SCAN_STATUS" != "COMPLETE" ]]; then
            if ! SCAN_OUTPUT=$(aws ecr start-image-scan --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$IMAGE_DIGEST" 2>&1); then
              if [[ "$SCAN_OUTPUT" == *"LimitExceededException"* ]]; then
                echo "ECR scan quota reached; using the existing scan"
              else
                echo "$SCAN_OUTPUT"
                exit 1
              fi
            fi
          else
            echo "ECR scan is already $SCAN_STATUS; reusing it"
          fi

          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$IMAGE_DIGEST"
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$IMAGE_DIGEST" | jq '[.imageScanFindings.findings[]? | select(.severity == "HIGH" or .severity == "CRITICAL")]' > ecr-findings.json

          echo "HIGH and CRITICAL ECR findings for ${{ matrix.image }}:"
          jq . ecr-findings.json

          [[ $(jq length ecr-findings.json) -eq 0 ]]

      - name: Evaluate Scan Results
        if: always()
        run: |
          TRIVY_HIGH="N/A"
          TRIVY_CRITICAL="N/A"
          ECR_HIGH="N/A"
          ECR_CRITICAL="N/A"

          if [[ -f trivy-findings.json ]]; then
            TRIVY_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-findings.json)
            TRIVY_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-findings.json)
          fi

          if [[ -f ecr-findings.json ]]; then
            ECR_HIGH=$(jq '[.[] | select(.severity == "HIGH")] | length' ecr-findings.json)
            ECR_CRITICAL=$(jq '[.[] | select(.severity == "CRITICAL")] | length' ecr-findings.json)
          fi

          TRIVY_RESULT="Passed"
          ECR_RESULT="Passed"
          OVERALL_RESULT="Passed"

          [[ "${{ steps.trivy.outcome }}" == "success" ]] || TRIVY_RESULT="Failed"
          [[ "${{ steps.ecr.outcome }}" == "success" ]] || ECR_RESULT="Failed"

          if [[ "$TRIVY_RESULT" == "Failed" || "$ECR_RESULT" == "Failed" ]]; then
            OVERALL_RESULT="Failed"
          fi

          {
            echo "## Image Security Scan: ${{ matrix.image }}"
            echo
            echo "**Tag:** \`${{ matrix.tag }}\`  "
            echo "**Platform:** \`linux/amd64\`  "
            echo "**Overall result:** **$OVERALL_RESULT**"
            echo
            echo "| Scanner | High | Critical | Result |"
            echo "| --- | ---: | ---: | --- |"
            echo "| Trivy | $TRIVY_HIGH | $TRIVY_CRITICAL | $TRIVY_RESULT |"
            echo "| ECR | $ECR_HIGH | $ECR_CRITICAL | $ECR_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$OVERALL_RESULT" == "Failed" ]]; then
            echo "HIGH or CRITICAL vulnerabilities found for ${{ matrix.image }}"
            exit 1
          fi

          echo "No HIGH or CRITICAL vulnerabilities found for ${{ matrix.image }}"