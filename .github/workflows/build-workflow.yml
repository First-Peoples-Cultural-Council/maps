name: Build Images

on:
  push:
    branches:
      - dev

jobs:
  set-context:
    name: Set Context
    runs-on: ubuntu-latest
    outputs:
      image_sha_tag: ${{ steps.context.outputs.image_sha_tag }}

    steps:
      - name: Compute branch context
        id: context
        shell: bash
        run: |
          IMAGE_SHA_TAG="dev-${GITHUB_SHA}"

          echo "image_sha_tag=$IMAGE_SHA_TAG" >> "$GITHUB_OUTPUT"

  build-and-push-images:
    name: Build and Push Images (Dev)
    runs-on: ubuntu-latest
    needs: [set-context]
    env:
      AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn run build

      - name: Build frontend Docker image (no push)
        run: |
          docker build \
            -f Dockerfile \
            -t frontend-dev:${{ github.sha }} \
            .

      - name: Build backend Docker image (no push)
        run: |
          docker build \
            -f ../web/Dockerfile \
            -t backend-dev:${{ github.sha }} \
            ../web

      - name: Validate AWS/ECR inputs
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_ACCESS_KEY_ID"
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "Missing secret: FPCC_DEFAULT_AWS_REGION"
            exit 1
          fi

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "Missing secret: ECR_REPOSITORY"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_INPUT }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_INPUT }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push frontend and backend images to ECR
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_SHA_TAG="${{ needs.set-context.outputs.image_sha_tag }}"
          FE_TAG="${IMAGE_SHA_TAG}-fe"
          BE_TAG="${IMAGE_SHA_TAG}-be"

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "ECR_REPOSITORY variable is required"
            exit 1
          fi

          docker tag "frontend-dev:${GITHUB_SHA}" "$ECR_REGISTRY/$ECR_REPOSITORY:$FE_TAG"
          docker tag "backend-dev:${GITHUB_SHA}" "$ECR_REGISTRY/$ECR_REPOSITORY:$BE_TAG"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$FE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$BE_TAG"
