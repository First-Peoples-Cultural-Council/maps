name: Maps Deployment

on:
  push:
    branches:
      - dev

  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: maps-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  set-context:
    name: Set Build Context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      fe_tag: ${{ steps.context.outputs.fe_tag }}
      be_tag: ${{ steps.context.outputs.be_tag }}

    steps:
      - name: Compute Environment and Image Tags
        id: context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" &&
                "${GITHUB_REF}" == "refs/heads/dev" ]]; then

            ENVIRONMENT="dev"
            SHORT_SHA="${GITHUB_SHA::7}"

            FE_TAG="fe-dev-${SHORT_SHA}"
            BE_TAG="be-dev-${SHORT_SHA}"

          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then

            ENVIRONMENT="prod"
            RELEASE_TAG="${{ github.event.release.tag_name }}"

            if [[ -z "$RELEASE_TAG" ]]; then
              echo "Release tag is missing"
              exit 1
            fi

            FE_TAG="fe-${RELEASE_TAG}"
            BE_TAG="be-${RELEASE_TAG}"

          else
            echo "Unsupported workflow trigger"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "fe_tag=$FE_TAG" >> "$GITHUB_OUTPUT"
          echo "be_tag=$BE_TAG" >> "$GITHUB_OUTPUT"

          echo "Environment: $ENVIRONMENT"
          echo "Frontend tag: $FE_TAG"
          echo "Backend tag: $BE_TAG"

  build-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest

    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS and ECR Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_ACCESS_KEY_ID"
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "Missing secret: FPCC_DEFAULT_AWS_REGION"
            exit 1
          fi

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "Missing secret: ECR_REPOSITORY"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build Frontend Application
        working-directory: frontend
        run: yarn run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.set-context.outputs.fe_tag }}
          cache-from: type=gha,scope=maps-frontend
          cache-to: type=gha,mode=max,scope=maps-frontend
          provenance: false

  build-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    needs:
      - set-context

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS and ECR Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_ACCESS_KEY_ID"
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "Missing secret: FPCC_DEFAULT_AWS_REGION"
            exit 1
          fi

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "Missing secret: ECR_REPOSITORY"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.set-context.outputs.be_tag }}
          cache-from: type=gha,scope=maps-backend
          cache-to: type=gha,mode=max,scope=maps-backend
          provenance: false

  update-values:
    name: Update Helm Values
    runs-on: ubuntu-latest

    needs:
      - set-context
      - build-frontend
      - build-backend

    env:
      CODE_COMMIT_REPOSITORY: ${{ secrets.CODE_COMMIT }}
      FE_TAG: ${{ needs.set-context.outputs.fe_tag }}
      BE_TAG: ${{ needs.set-context.outputs.be_tag }}

    steps:
      - name: Validate CodeCommit Configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_ACCESS_KEY_ID"
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY_INPUT" ]]; then
            echo "Missing secret: FPCC_AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "Missing secret: FPCC_DEFAULT_AWS_REGION"
            exit 1
          fi

          if [[ -z "$CODE_COMMIT_REPOSITORY" ]]; then
            echo "Missing secret: CODE_COMMIT"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select Values File
        id: values
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ needs.set-context.outputs.environment }}"

          case "$ENVIRONMENT" in
            dev)
              VALUES_FILE="Values.dev_maps.yaml"
              ;;
            prod)
              VALUES_FILE="Values.prod_maps.yaml"
              ;;
            *)
              echo "Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "values_file=$VALUES_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected values file: $VALUES_FILE"

      - name: Download Values File
        shell: bash
        run: |
          set -euo pipefail

          aws codecommit get-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --commit-specifier main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --query fileContent \
            --output text |
          base64 -d > values.yaml

          test -s values.yaml

      - name: Update Image Tags
        uses: mikefarah/yq@v4.45.4
        env:
          FE_TAG: ${{ env.FE_TAG }}
          BE_TAG: ${{ env.BE_TAG }}
        with:
          cmd: >-
            yq -i
            '.frontend.image.tag = strenv(FE_TAG) |
            .backend.image.tag = strenv(BE_TAG)'
            values.yaml

      - name: Validate Updated Image Tags
        uses: mikefarah/yq@v4.45.4
        env:
          FE_TAG: ${{ env.FE_TAG }}
          BE_TAG: ${{ env.BE_TAG }}
        with:
          cmd: >-
            yq -e
            '.frontend.image.tag == strenv(FE_TAG) and
            .backend.image.tag == strenv(BE_TAG)'
            values.yaml

      - name: Get Current CodeCommit Revision
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_ID=$(
            aws codecommit get-branch \
              --repository-name "$CODE_COMMIT_REPOSITORY" \
              --branch-name main \
              --query branch.commitId \
              --output text
          )

          if [[ -z "$COMMIT_ID" || "$COMMIT_ID" == "None" ]]; then
            echo "Unable to find current CodeCommit revision"
            exit 1
          fi

          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload Updated Values File
        shell: bash
        run: |
          set -euo pipefail

          aws codecommit put-file \
            --repository-name "$CODE_COMMIT_REPOSITORY" \
            --branch-name main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --file-content fileb://values.yaml \
            --parent-commit-id "${{ steps.commit.outputs.commit_id }}" \
            --commit-message "Update Maps image tags ($FE_TAG / $BE_TAG)" \
            --no-cli-pager \
            > /dev/null

          echo "Latest image tags were updated for the ${{ needs.set-context.outputs.environment }} environment"