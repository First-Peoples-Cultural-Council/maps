name: Build Images

on:
  push:
    branches:
      - dev

jobs:
  set-context:
    name: Set Context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      fe_tag: ${{ steps.context.outputs.fe_tag }}
      be_tag: ${{ steps.context.outputs.be_tag }}

    steps:
      - name: Compute Env
        id: context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" &&
                "${GITHUB_REF}" == "refs/heads/dev" ]]; then

            ENVIRONMENT="dev"
            SHORT_SHA="${GITHUB_SHA::7}"

            FE_TAG="fe-dev-${SHORT_SHA}"
            BE_TAG="be-dev-${SHORT_SHA}"

          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then

            ENVIRONMENT="prod"
            RELEASE_TAG="${{ github.event.release.tag_name }}"

            if [[ -z "$RELEASE_TAG" ]]; then
              echo "Release tag is missing"
              exit 1
            fi

            FE_TAG="fe-${RELEASE_TAG}"
            BE_TAG="be-${RELEASE_TAG}"

          else
            echo "Unsupported workflow trigger"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "fe_tag=$FE_TAG" >> "$GITHUB_OUTPUT"
          echo "be_tag=$BE_TAG" >> "$GITHUB_OUTPUT"

          echo "Environment: $ENVIRONMENT"
          echo "Frontend tag: $FE_TAG"
          echo "Backend tag: $BE_TAG"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [set-context]
    env:
      AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_values=(
            "${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}"
            "${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}"
            "$AWS_REGION"
            "$ECR_REPOSITORY"
          )

          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "Required AWS or ECR configuration is missing"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build Frontend Application
        working-directory: frontend
        run: yarn run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >-
            ${{ steps.login-ecr.outputs.registry }}/${{
              env.ECR_REPOSITORY
            }}:${{ needs.set-context.outputs.fe_tag }}
          cache-from: type=gha,scope=maps-frontend
          cache-to: type=gha,mode=max,scope=maps-frontend
          provenance: false

      - name: Verify Frontend Image Platforms
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${{
            needs.set-context.outputs.fe_tag
          }}"

          docker buildx imagetools inspect "$IMAGE"

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs:
      - set-context

    env:
      AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_values=(
            "${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}"
            "${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}"
            "$AWS_REGION"
            "$ECR_REPOSITORY"
          )

          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "Required AWS or ECR configuration is missing"
              exit 1
            fi
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >-
            ${{ steps.login-ecr.outputs.registry }}/${{
              env.ECR_REPOSITORY
            }}:${{ needs.set-context.outputs.be_tag }}
          cache-from: type=gha,scope=maps-backend
          cache-to: type=gha,mode=max,scope=maps-backend
          provenance: false

      - name: Verify Backend Image Platforms
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${{
            needs.set-context.outputs.be_tag
          }}"

          docker buildx imagetools inspect "$IMAGE"

  update-values:
    name: Update Helm Values
    runs-on: ubuntu-latest

    needs:
      - set-context
      - build-frontend
      - build-backend

    env:
      AWS_REGION: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Select Values File
        id: values
        shell: bash
        run: |
          ENVIRONMENT="${{ needs.set-context.outputs.environment }}"

          if [[ "$ENVIRONMENT" == "prod" ]]; then
            VALUES_FILE="Values.prod_maps.yaml"
          else
            VALUES_FILE="Values.dev_maps.yaml"
          fi

          echo "values_file=$VALUES_FILE" >> "$GITHUB_OUTPUT"

      - name: Download Values File
        run: |
          aws codecommit get-file \
            --repository-name "${{ secrets.CODE_COMMIT }}" \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --query fileContent \
            --output text | base64 -d > values.yaml

      - name: Update Image Tags
        run: |
          yq -i '
            .frontend.image.tag = "${{ needs.set-context.outputs.fe_tag }}"
          ' values.yaml

          yq -i '
            .backend.image.tag = "${{ needs.set-context.outputs.be_tag }}"
          ' values.yaml

      - name: Get Current Commit
        id: commit
        run: |
          COMMIT_ID=$(aws codecommit get-branch \
            --repository-name "${{ secrets.CODE_COMMIT }}" \
            --branch-name main \
            --query branch.commitId \
            --output text)

          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload Updated Values File
        run: |
          FILE_CONTENT=$(base64 -w 0 values.yaml)

          aws codecommit put-file \
            --repository-name "${{ secrets.CODE_COMMIT }}" \
            --branch-name main \
            --file-path "${{ steps.values.outputs.values_file }}" \
            --file-content "$FILE_CONTENT" \
            --parent-commit-id "${{ steps.commit.outputs.commit_id }}" \
            --commit-message "Update Maps image tags (${{
              needs.set-context.outputs.fe_tag
            }} / ${{
              needs.set-context.outputs.be_tag
            }})" \
            > /dev/null 2>&1
          echo "Latest image tag is updated for this environment"