name: Frontend Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend checks (Node 22.18.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      NODE_OPTIONS: --openssl-legacy-provider
      NODE_ENV: production
      HOST: http://localhost
      BACKEND_URL: http://localhost:8000
      COGNITO_REGION: ca-central-1
      COGNITO_USERPOOL_ID: ci-user-pool
      COGNITO_APP_CLIENT_ID: ci-app-client
      COGNITO_HOST: http://localhost
      COGNITO_URL: http://localhost
      MAPBOX_ACCESS_TOKEN: ci-mapbox-token
      MAPBOX_STYLE_URL: mapbox://styles/ci/style

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22.18.0
        uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build