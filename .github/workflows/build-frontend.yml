name: Frontend Dev Build

on:
  push:
    branches:
      - dev
      - devops-workflows
    paths:
      - frontend/**
      - .github/workflows/build-frontend.yml
  pull_request:
    branches:
      - dev
      - devops-workflows
    paths:
      - frontend/**
      - .github/workflows/build-frontend.yml
  workflow_dispatch:

jobs:
  build-frontend-dev:
    name: Build Frontend (Dev)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.FPCC_DEFAULT_AWS_REGION || vars.AWS_REGION || secrets.FPCC_DEFAULT_AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
      AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.FPCC_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn run build

      - name: Build frontend Docker image (no push)
        run: |
          docker build \
            -f Dockerfile \
            -t frontend-dev:${{ github.sha }} \
            .

      - name: Validate AWS/ECR inputs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/devops-workflows')
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID_INPUT" ]]; then
            echo "Missing AWS access key secret. Expected one of: AWS_ACCESS_KEY_ID or FPCC_AWS_ACCESS_KEY_ID."
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY_INPUT" ]]; then
            echo "Missing AWS secret access key. Expected one of: AWS_SECRET_ACCESS_KEY or FPCC_AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "Missing AWS region. Expected one of: vars.FPCC_DEFAULT_AWS_REGION, vars.AWS_REGION, or secrets.FPCC_DEFAULT_AWS_REGION."
            exit 1
          fi

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "Missing ECR repository. Expected one of: vars.ECR_REPOSITORY or secrets.ECR_REPOSITORY."
            exit 1
          fi

      - name: Show resolved input sources (safe)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/devops-workflows')
        env:
          AWS_KEY_NEW: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_KEY_LEGACY: ${{ secrets.FPCC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_NEW: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SECRET_LEGACY: ${{ secrets.FPCC_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_NEW: ${{ vars.AWS_REGION }}
          AWS_REGION_LEGACY: ${{ vars.FPCC_DEFAULT_AWS_REGION }}
          AWS_REGION_SECRET_FALLBACK: ${{ secrets.FPCC_DEFAULT_AWS_REGION }}
          ECR_REPO_VAR: ${{ vars.ECR_REPOSITORY }}
          ECR_REPO_SECRET: ${{ secrets.ECR_REPOSITORY }}
        run: |
          if [[ -n "$AWS_KEY_NEW" ]]; then
            echo "AWS access key source: secrets.AWS_ACCESS_KEY_ID"
          elif [[ -n "$AWS_KEY_LEGACY" ]]; then
            echo "AWS access key source: secrets.FPCC_AWS_ACCESS_KEY_ID"
          fi

          if [[ -n "$AWS_SECRET_NEW" ]]; then
            echo "AWS secret key source: secrets.AWS_SECRET_ACCESS_KEY"
          elif [[ -n "$AWS_SECRET_LEGACY" ]]; then
            echo "AWS secret key source: secrets.FPCC_AWS_SECRET_ACCESS_KEY"
          fi

          if [[ -n "$AWS_REGION_LEGACY" ]]; then
            echo "AWS region source: vars.FPCC_DEFAULT_AWS_REGION"
          elif [[ -n "$AWS_REGION_NEW" ]]; then
            echo "AWS region source: vars.AWS_REGION"
          elif [[ -n "$AWS_REGION_SECRET_FALLBACK" ]]; then
            echo "AWS region source: secrets.FPCC_DEFAULT_AWS_REGION"
          fi

          if [[ -n "$ECR_REPO_VAR" ]]; then
            echo "ECR repository source: vars.ECR_REPOSITORY"
          elif [[ -n "$ECR_REPO_SECRET" ]]; then
            echo "ECR repository source: secrets.ECR_REPOSITORY"
          fi

      - name: Configure AWS credentials
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/devops-workflows')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_INPUT }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_INPUT }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/devops-workflows')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push frontend image to ECR (dev)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/devops-workflows')
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          if [[ "$GITHUB_REF_NAME" == "devops-workflows" ]]; then
            IMAGE_TAG_PREFIX="devops"
          else
            IMAGE_TAG_PREFIX="dev"
          fi

          IMAGE_SHA_TAG="${IMAGE_TAG_PREFIX}-${GITHUB_SHA}"
          IMAGE_LATEST_TAG="${IMAGE_TAG_PREFIX}-latest"

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "ECR_REPOSITORY variable is required"
            exit 1
          fi

          docker tag "frontend-dev:${GITHUB_SHA}" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG"
          docker tag "frontend-dev:${GITHUB_SHA}" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_LATEST_TAG"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_LATEST_TAG"